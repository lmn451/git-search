<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Git Search</title>
    <style>
      body {
        font-family: var(--vscode-font-family);
        font-size: var(--vscode-font-size);
        color: var(--vscode-foreground);
        background-color: var(--vscode-editor-background);
        padding: 10px;
        overflow-y: auto;
      }
      #searchInput,
      #findInput {
        width: calc(100% - 100px);
        padding: 8px;
        margin-bottom: 10px;
        border: 1px solid var(--vscode-input-border);
        background-color: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border-radius: 4px;
      }
      #searchButton,
      #loadMore,
      #resetButton,
      #findPrev,
      #findNext {
        padding: 8px 12px;
        border: 1px solid var(--vscode-button-border, transparent);
        background-color: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        cursor: pointer;
        border-radius: 4px;
        margin-left: 5px;
      }
      #loadMore {
        display: none;
        width: 100%;
        margin-top: 10px;
      }
      #searchButton:hover,
      #loadMore:hover,
      #resetButton:hover,
      #findPrev:hover,
      #findNext:hover {
        background-color: var(--vscode-button-hoverBackground);
      }
      ul#results {
        list-style: none;
        padding: 0;
        margin: 0;
        font-family: var(--vscode-editor-font-family);
      }
      ul#results span {
        white-space: pre-wrap;
      }
      .commit-item {
        margin-bottom: 10px;
        padding: 5px;
        border-radius: 3px;
        background-color: var(--vscode-editorWidget-background);
        border: 1px solid var(--vscode-editorWidget-border);
      }
      a {
        color: var(--vscode-textLink-foreground);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .highlight {
        background-color: var(--vscode-editor-findMatchHighlightBackground);
        color: var(--vscode-editor-foreground);
        border-radius: 2px;
      }
      .find-container {
        position: fixed;
        top: 10px;
        right: 10px;
        background-color: var(--vscode-editorWidget-background);
        padding: 5px;
        border: 1px solid var(--vscode-editorWidget-border);
        border-radius: 5px;
        display: flex;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 2px 8px var(--vscode-widget-shadow);
      }
      #findInput {
        width: 150px;
        margin-bottom: 0;
      }
      #findPrev,
      #findNext {
        margin-left: 2px;
      }
      .dialog-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }
      .dialog-content {
        background-color: var(--vscode-editor-background);
        padding: 20px;
        border-radius: 5px;
        width: 80%;
        max-height: 80vh;
        overflow-y: auto;
        border: 1px solid var(--vscode-editorWidget-border);
        box-shadow: 0 4px 12px var(--vscode-widget-shadow);
      }
      .dialog-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .dialog-close {
        cursor: pointer;
        background: none;
        border: none;
        color: var(--vscode-foreground);
        font-size: 24px;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <input type="text" id="searchInput" placeholder="Enter search query..." />
    <button id="searchButton">Search</button>
    <button id="resetButton">Reset</button>

    <div id="results" class="results-container"></div>
    <button id="loadMore">Load More</button>

    <div class="find-container">
      <input type="text" id="findInput" placeholder="Find in results..." />
      <button id="findPrev">↑</button>
      <button id="findNext">↓</button>
    </div>

    <div id="dialogOverlay" class="dialog-overlay" style="display: none">
      <div class="dialog-content">
        <div class="dialog-header">
          <h3>Full Diff</h3>
          <button id="dialogClose" class="dialog-close">&times;</button>
        </div>
        <div id="dialogBody"></div>
      </div>
    </div>

    <script nonce="{{nonce}}">
      const vscode = acquireVsCodeApi();

      // Signal to the extension that the webview is ready.
      window.addEventListener("load", () => {
        vscode.postMessage({
          command: "webview-ready",
        });
      });

      const searchInput = document.getElementById("searchInput");
      const searchButton = document.getElementById("searchButton");
      const resetButton = document.getElementById("resetButton");
      const resultsDiv = document.getElementById("results");
      const loadMoreButton = document.getElementById("loadMore");
      const findInput = document.getElementById("findInput");
      const findPrev = document.getElementById("findPrev");
      const findNext = document.getElementById("findNext");
      const dialogOverlay = document.getElementById("dialogOverlay");
      const dialogClose = document.getElementById("dialogClose");
      const dialogBody = document.getElementById("dialogBody");

      let currentHighlights = [];
      let currentFindIndex = -1;

      findInput.addEventListener("input", () =>
        searchAndHighlight(findInput.value),
      );
      findInput.addEventListener(
        "keydown",
        (e) => e.key === "Enter" && navigateFind("next"),
      );
      findPrev.addEventListener("click", () => navigateFind("prev"));
      findNext.addEventListener("click", () => navigateFind("next"));

      dialogOverlay.addEventListener("click", (e) => {
        if (e.target === dialogOverlay) {
          dialogOverlay.style.display = "none";
        }
      });

      dialogClose.addEventListener("click", () => {
        dialogOverlay.style.display = "none";
      });

      function searchAndHighlight(term) {
        // Clear previous highlights
        currentHighlights.forEach((el) => {
          el.outerHTML = el.innerHTML; // Replace the span with its content
        });
        currentHighlights = [];
        currentFindIndex = -1;

        if (!term) return; // Do nothing if search term is empty

        const regex = new RegExp(term, "gi");
        const resultsContainer = document.getElementById("results");

        // Function to process a node and its children
        function processNode(node) {
          if (
            node.nodeType === Node.TEXT_NODE &&
            node.parentNode.nodeName !== "SCRIPT" &&
            node.parentNode.nodeName !== "STYLE"
          ) {
            const text = node.textContent;
            let lastIndex = 0;
            const newNodes = [];
            let match;

            while ((match = regex.exec(text)) !== null) {
              if (match.index > lastIndex) {
                newNodes.push(
                  document.createTextNode(text.slice(lastIndex, match.index)),
                );
              }
              const highlightSpan = document.createElement("span");
              highlightSpan.className = "highlight";
              highlightSpan.textContent = match[0];
              newNodes.push(highlightSpan);
              currentHighlights.push(highlightSpan);
              lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) {
              newNodes.push(document.createTextNode(text.slice(lastIndex)));
            }

            if (newNodes.length > 0) {
              const parent = node.parentNode;
              newNodes.forEach((newNode) => parent.insertBefore(newNode, node));
              parent.removeChild(node);
            }
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            // Recursively process child nodes, avoiding script and style tags
            if (node.nodeName !== "SCRIPT" && node.nodeName !== "STYLE") {
              Array.from(node.childNodes).forEach(processNode);
            }
          }
        }

        processNode(resultsContainer);

        if (currentHighlights.length > 0) {
          currentFindIndex = 0;
          currentHighlights[currentFindIndex].style.backgroundColor =
            "var(--vscode-editor-findMatchBackground)";
        }
      }

      function navigateFind(direction) {
        if (currentHighlights.length === 0) return;

        // Reset style of the current highlight
        currentHighlights[currentFindIndex].style.backgroundColor =
          "var(--vscode-editor-findMatchHighlightBackground)";

        if (direction === "next") {
          currentFindIndex = (currentFindIndex + 1) % currentHighlights.length;
        } else {
          currentFindIndex =
            (currentFindIndex - 1 + currentHighlights.length) %
            currentHighlights.length;
        }

        const nextHighlight = currentHighlights[currentFindIndex];
        nextHighlight.style.backgroundColor =
          "var(--vscode-editor-findMatchBackground)";
        nextHighlight.scrollIntoView({
          behavior: "smooth",
          block: "center",
        });
      }

      searchButton.addEventListener("click", () => {
        const query = searchInput.value;
        if (query) {
          vscode.postMessage({
            command: "search",
            text: query,
          });
        }
      });

      resetButton.addEventListener("click", () => {
        searchInput.value = "";
        resultsDiv.innerHTML = "";
        loadMoreButton.style.display = "none";
        vscode.postMessage({ command: "reset" });
      });

      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          searchButton.click();
        }
      });

      loadMoreButton.addEventListener("click", () => {
        vscode.postMessage({ command: "loadMore" });
      });

      resultsDiv.addEventListener("click", (event) => {
        if (event.target.tagName === "A" && event.target.dataset.commitHash) {
          event.preventDefault();
          const commitHash = event.target.dataset.commitHash;
          const filename = event.target.dataset.filename;
          vscode.postMessage({ command: "getFullDiff", commitHash, filename });
        }
      });

      window.addEventListener("message", (event) => {
        const message = event.data;
        switch (message.command) {
          case "showResults":
            if (message.append) {
              resultsDiv.innerHTML += message.html;
            } else {
              resultsDiv.innerHTML = message.html;
            }
            loadMoreButton.style.display = "block";
            break;
          case "reset":
            searchInput.value = "";
            resultsDiv.innerHTML = "";
            loadMoreButton.style.display = "none";
            break;
          case "showDialog":
            dialogBody.innerHTML = message.text;
            dialogOverlay.style.display = "flex";
            break;
        }
      });
    </script>
  </body>
</html>
