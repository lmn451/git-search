<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Layout and base colors */
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: var(--vscode-editor-font-family);
        background: var(--vscode-editor-background);
        color: var(--vscode-foreground);
        display: grid;
        grid-template-rows: auto 1fr auto;
        height: 100vh;
      }
      pre {
        font-family: var(--vscode-editor-font-family);
        margin: 0;
        white-space: pre;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--vscode-editor-background);
        border-bottom: 1px solid var(--vscode-panel-border);
        padding-bottom: 4px;
      }

      :focus-visible {
        outline: 2px solid var(--vscode-focusBorder);
        outline-offset: 2px;
      }

      input {
        background-color: var(--vscode-input-background);
        color: var(--vscode-input-foreground);
        border: 1px solid var(--vscode-input-border, transparent);
        border-radius: 4px;
      }

      input::-webkit-input-placeholder {
        color: var(--vscode-input-placeholderForeground);
      }

      button {
        background-color: var(--vscode-button-background);
        color: var(--vscode-button-foreground);
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: var(--vscode-button-hoverBackground);
      }

      #searchQuery {
        padding: 8px;
        margin: 8px;
        flex-grow: 1;
      }

      #searchBtn,
      #loadMoreBtn,
      #resetBtn {
        padding: 8px 12px;
        margin: 8px 0;
      }

      #results {
        overflow: auto;
        padding: 8px;
        display: grid;
        gap: 8px;
      }
      /* Wrap lines toggle */
      #results.wrap .diff-body {
        white-space: pre-wrap;
        word-break: break-word;
      }

      /* Commit entries */
      .commit-diff {
        padding: 8px;
        border: 1px solid var(--vscode-panel-border);
        border-radius: 6px;
        transition: box-shadow 120ms ease;
      }
      .commit-diff:hover {
        box-shadow: 0 1px 3px var(--vscode-widgetShadow, rgba(0,0,0,0.25));
      }

      .commit-diff a {
        text-decoration: none;
        color: var(--vscode-textLink-foreground);
      }

      .commit-diff a:hover {
        color: var(--vscode-textLink-activeForeground);
        text-decoration: underline;
      }

      .commit-header {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }

      .commit-title {
        font-weight: 600;
      }

      .commit-meta {
        color: var(--vscode-descriptionForeground);
      }

      .commit-actions {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }

      .btn-ghost {
        background: transparent;
        color: var(--vscode-foreground);
      }

      .btn-ghost:hover {
        background: var(--vscode-toolbar-hoverBackground, rgba(0,0,0,0.05));
      }
      .toggle-diff svg {
        transition: transform 120ms ease;
      }
      .toggle-diff[aria-expanded="false"] svg {
        transform: rotate(180deg);
      }

      .diff-body.collapsed {
        display: none;
      }

      /* Find widget */
      .find-widget {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        align-items: center;
        padding: 4px 8px;
        background: var(--vscode-editorWidget-background);
        border-top: 1px solid var(--vscode-panel-border);
        border-bottom: 1px solid var(--vscode-panel-border);
      }

      /* Toolbar */
      .toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        background: var(--vscode-editorWidget-background);
        border-bottom: 1px solid var(--vscode-panel-border);
      }
      .toolbar-right {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .btn-icon {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .btn-ghost[aria-pressed="true"] {
        background: var(--vscode-toolbar-activeBackground, rgba(127,127,127,0.2));
      }
      .btn-icon svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--vscode-badge-background);
        color: var(--vscode-badge-foreground);
        font-size: 12px;
      }

      .highlight {
        background-color: var(--vscode-editor-findMatchHighlightBackground);
        color: inherit;
        outline: 1px solid var(--vscode-editor-findMatchBorder, transparent);
        border-radius: 2px;
      }

      .current-highlight {
        background-color: var(--vscode-editor-findMatchBackground);
        color: inherit;
        outline: 1px solid var(--vscode-editor-findMatchBorder, transparent);
        border-radius: 2px;
      }

      .search-container {
        justify-content: space-between;
        display: flex;
        gap: 16px;
      }

      .modeContainer {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .searched-query {
        background: var(--vscode-editor-findMatchHighlightBackground);
        outline: 1px solid var(--vscode-editor-findMatchBorder, transparent);
        border-radius: 2px;
        padding: 0 2px;
      }

      #numberOfContextLines {
        width: 48px;
      }

      .search-handlers-container {
        display: flex;
        gap: 8px;
        justify-content: space-between;
        align-items: center;
      }

      .search-settings {
        display: flex;
        gap: 8px;
      }

      footer {
        display: grid;
        padding: 8px;
      }

      #loadMoreBtn {
        justify-self: flex-end;
      }

      #goTopBtn {
        position: fixed;
        bottom: 60px;
        right: 20px;
        width: 36px;
        height: 36px;
        z-index: 1000;
        padding: 8px;
        border-radius: 50%;
        cursor: pointer;
        opacity: 0.8;
        transition: opacity 0.2s;
        background: var(--vscode-button-secondaryBackground, var(--vscode-button-background));
        color: var(--vscode-button-secondaryForeground, var(--vscode-button-foreground));
        border: 1px solid var(--vscode-panel-border);
      }

      #goTopBtn:hover {
        opacity: 1;
      }
    </style>
    <title>Git Search</title>
  </head>

  <body onload="searchQuery.focus()">
    <header>
      <div class="search-container">
        <input
          type="text"
          id="searchQuery"
          placeholder="Enter search query (regexp friendly when G mode is enabled)"
        />
        <div class="search-handlers-container">
          <div class="search-settings">
            <div
              class="modeContainer"
              title="'G mode' refers to git log -G, a broader search than the standard 'S mode'"
            >
              <input type="checkbox" id="modeG" name="modeG" />
              <label for="modeG">G mode</label>
            </div>
            <div class="modeContainer" title="Change number of context lines ">
              <input
                type="number"
                min="1"
                value="3"
                id="numberOfContextLines"
                name="numberOfContextLines"
              />
              <label for="numberOfContextLines">Number of context lines</label>
            </div>
          </div>
          <div class="button-containers">
            <button id="searchBtn">Search</button>
            <button id="resetBtn">Reset</button>
          </div>
        </div>
      </div>
      <div class="toolbar">
        <div class="toolbar-left">
          <span id="resultCount" class="badge" title="Results">0</span>
        </div>
        <div class="toolbar-right">
          <button id="wrapToggle" class="btn-ghost btn-icon" aria-pressed="false" title="Wrap lines" aria-label="Wrap lines">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11a3 3 0 110 6H13l1.3 1.3-1.4 1.4L10 12.8l2.9-2.9 1.4 1.4L13.8 11H3V7zm0 10h10v2H3v-2z"/></svg>
          </button>
          <button id="expandAll" class="btn-ghost btn-icon" title="Expand all" aria-label="Expand all">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5H7z"/></svg>
          </button>
          <button id="collapseAll" class="btn-ghost btn-icon" title="Collapse all" aria-label="Collapse all">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5H7z"/></svg>
          </button>
        </div>
      </div>
      <div id="findWidget" class="find-widget" style="display: none">
        <input type="text" id="findInput" placeholder="Find" />
        <span id="matchCount"></span>
        <button id="findPrev">Previous</button>
        <button id="findNext">Next</button>
      </div>
    </header>
    <div id="results"></div>
    <button id="goTopBtn" aria-label="Go to top" style="display: none">
      ↑
    </button>
    <footer>
      <button id="loadMoreBtn" style="display: none">Load More</button>
    </footer>

    <script>
      //Go to top button logic
      results.addEventListener("scroll", () => {
        if (results.scrollTop > 100) {
          goTopBtn.style.display = "block";
        } else {
          goTopBtn.style.display = "none";
        }
      });

      goTopBtn.addEventListener("click", () => {
        results.scrollTo({
          top: 0,
          behavior: "smooth",
        });
      });

      // Mode logic
      modeG.addEventListener("change", (e) => {
        vscode.postMessage({
          command: "changeMode",
          mode: e.target.checked ? "G" : "S",
        });
      });

      // Keyboard shortcut for Load More: Cmd/Ctrl+L
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && (e.key === "l" || e.key === "L")) {
          e.preventDefault();
          vscode.postMessage({ command: "loadMore" });
        }
      });

      // Toolbar controls
      let wrapOn = false;
      wrapToggle.addEventListener("click", () => {
        wrapOn = !wrapOn;
        wrapToggle.setAttribute("aria-pressed", String(wrapOn));
        results.classList.toggle("wrap", wrapOn);
      });
      expandAll.addEventListener("click", () => {
        document.querySelectorAll(".commit-diff .diff-body").forEach((pre) => pre.classList.remove("collapsed"));
        document.querySelectorAll(".commit-diff .toggle-diff").forEach((btn) => btn.setAttribute("aria-expanded", "true"));
      });
      collapseAll.addEventListener("click", () => {
        document.querySelectorAll(".commit-diff .diff-body").forEach((pre) => pre.classList.add("collapsed"));
        document.querySelectorAll(".commit-diff .toggle-diff").forEach((btn) => btn.setAttribute("aria-expanded", "false"));
      });

      numberOfContextLines.addEventListener("change", (e) => {
        vscode.postMessage({
          command: "updateNumberOfContextLines",
          value: Number(e.target.value),
        });
      });

      //Search Logic
      const vscode = acquireVsCodeApi();

      function ifEnterSearch(e) {
        e.key === "Enter" &&
          vscode.postMessage({ command: "search", text: searchQuery.value });
      }

      searchQuery.addEventListener("keydown", ifEnterSearch);

      searchBtn.addEventListener("click", () => {
        const query = searchQuery.value;
        vscode.postMessage({ command: "search", text: query });
      });

      resetBtn.addEventListener("click", () => {
        searchQuery.value = "";
        vscode.postMessage({ command: "reset" });
      });

      loadMoreBtn.addEventListener("click", () => {
        loadMoreBtn.innerHTML = "Loading";
        loadMoreBtn.disabled = true;
        vscode.postMessage({ command: "loadMore", text: "" });
      });

      window.addEventListener("message", (event) => {
        const message = event.data;
        switch (message.command) {
          case "showResults":
            results.innerHTML = message.text
              ? `<ol id='list' role='list'>${message.text}</ol>`
              : "No results found";
            if (wrapOn) results.classList.add("wrap");
            resultCount.textContent = String(document.querySelectorAll(".commit-diff").length);
            loadMoreBtn.style.display = message.isLoadMore ? "block" : "none";
            loadMoreBtn.innerHTML = "Load More";
            loadMoreBtn.disabled = false;
            break;
          case "appendResults":
            list.innerHTML += message.text || "Nothing More";
            if (wrapOn) results.classList.add("wrap");
            resultCount.textContent = String(document.querySelectorAll(".commit-diff").length);
            loadMoreBtn.style.display = message.text ? "block" : "none";
            loadMoreBtn.innerHTML = "Load More";
            loadMoreBtn.disabled = false;
            break;
          case "updateCommitDiff": {
            const li = document.querySelector(`.commit-diff[data-commit='${message.commit}']`);
            if (li) {
              const pre = li.querySelector(".diff-body");
              if (pre) pre.innerHTML = message.diffHtml || "";
              const countEl = li.querySelector(".lines-count");
              if (countEl) countEl.textContent = String(message.value);
            }
            break;
          }
          case "reset":
            results.innerHTML = "";
            loadMoreBtn.style.display = "none";
            findInput.value = "";
            matchCount.innerHTML = "";
            loadMoreBtn.innerHTML = "Load More";
            loadMoreBtn.disabled = false;
            break;
        }
      });

      //Toggle find
      let findTriggered = false;

      document.addEventListener("keydown", function (event) {
        // Check for CMD+F on Mac or CTRL+F on Windows
        if ((event.metaKey || event.ctrlKey) && event.key === "f") {
          event.preventDefault(); // Prevent the default find behavior
          findTriggered = !findTriggered;
          findWidget.style.display = findTriggered ? "flex" : "none";
          if (findTriggered) findInput.focus();
          else searchQuery.focus();
        }
      });

      // Find Logic
      let findMatches = [];
      let currentFindIndex = -1;

      findInput.addEventListener("input", () =>
        searchAndHighlight(findInput.value)
      );
      findInput.addEventListener(
        "keydown",
        (e) => e.key === "Enter" && navigateFind("next")
      );
      findPrev.addEventListener("click", () => navigateFind("prev"));
      findNext.addEventListener("click", () => navigateFind("next"));

      function searchAndHighlight(query) {
        resetHighlights();
        findMatches = [];
        currentFindIndex = -1;
        if (!query) {
          updateMatchCount(0, 0); // Reset counter when query is empty
          return;
        }

        const regex = new RegExp(escapeRegExp(query), "gi");
        document.querySelectorAll(".commit-diff").forEach((commitElem) => {
          processNode(commitElem, regex);
        });

        if (findMatches.length > 0) {
          navigateFind("next");
        } else {
          updateMatchCount(0, 0);
        }
      }

      function processNode(node, regex) {
        if (node.nodeType === Node.TEXT_NODE) {
          const text = node.textContent;
          const parent = node.parentNode;
          const docFrag = document.createDocumentFragment();

          let startIndex = 0,
            match;
          while ((match = regex.exec(text)) !== null) {
            docFrag.appendChild(
              document.createTextNode(text.substring(startIndex, match.index))
            );

            const highlightSpan = document.createElement("span");
            highlightSpan.className = "highlight";
            highlightSpan.textContent = match[0];
            docFrag.appendChild(highlightSpan);
            findMatches.push(highlightSpan);

            startIndex = match.index + match[0].length;
          }
          docFrag.appendChild(
            document.createTextNode(text.substring(startIndex))
          );

          if (startIndex > 0) {
            parent.replaceChild(docFrag, node);
          }
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          Array.from(node.childNodes).forEach((child) =>
            processNode(child, regex)
          );
        }
      }

      function navigateFind(direction) {
        if (findMatches.length === 0) return;
        if (currentFindIndex !== -1) {
          findMatches[currentFindIndex].classList.remove("current-highlight");
        }
        if (direction === "next") {
          currentFindIndex = (currentFindIndex + 1) % findMatches.length;
        } else if (direction === "prev") {
          currentFindIndex =
            (currentFindIndex - 1 + findMatches.length) % findMatches.length;
        }
        findMatches[currentFindIndex].classList.add("current-highlight");
        findMatches[currentFindIndex].scrollIntoView({
          behavior: "smooth",
          block: "center",
        });
        updateMatchCount(currentFindIndex + 1, findMatches.length);
      }

      function updateMatchCount(currentIndex, totalMatches) {
        matchCount.textContent =
          totalMatches > 0 ? `${currentIndex} of ${totalMatches}` : "";
      }

      function resetHighlights() {
        document.querySelectorAll(".highlight").forEach((highlightSpan) => {
          const textNode = document.createTextNode(highlightSpan.textContent);
          const parent = highlightSpan.parentNode;
          parent.replaceChild(textNode, highlightSpan);
          parent.normalize(); // Normalize merges adjacent text nodes
        });
        findMatches = [];
        currentFindIndex = -1;
      }

      function escapeRegExp(text) {
        return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      }

      // Result actions: copy hash, collapse/expand diff, per-commit context lines +/-
      results.addEventListener("click", (e) => {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        // Copy commit hash
        if (target.classList.contains("copy-hash")) {
          const li = target.closest(".commit-diff");
          const commit = target.getAttribute("data-commit") || li?.getAttribute("data-commit");
          if (commit) {
            vscode.postMessage({ command: "copyCommitHash", value: commit });
            target.textContent = "Copied";
            setTimeout(() => (target.textContent = "Copy"), 1200);
          }
        }
        // Toggle diff
        if (target.classList.contains("toggle-diff")) {
          const li = target.closest(".commit-diff");
          if (!li) return;
          const pre = li.querySelector(".diff-body");
          if (!pre) return;
          const isCollapsed = pre.classList.toggle("collapsed");
          target.setAttribute("aria-expanded", String(!isCollapsed));
        }
        // Increase/decrease context lines per commit
        if (target.classList.contains("inc-lines") || target.classList.contains("dec-lines")) {
          const li = target.closest(".commit-diff");
          if (!li) return;
          const commit = target.getAttribute("data-commit") || li.getAttribute("data-commit");
          const countEl = li.querySelector(".lines-count");
          let current = parseInt(countEl?.textContent || "3", 10);
          if (Number.isNaN(current)) current = 3;
          const next = target.classList.contains("inc-lines") ? current + 1 : current - 1;
          const clamped = Math.max(1, Math.min(50, next));
          if (clamped === current) return;
          // Optimistic UI update; server will send authoritative update
          if (countEl) countEl.textContent = String(clamped);
          vscode.postMessage({ command: "changeContextLines", commit, value: clamped });
        }
      });
    </script>
  </body>
</html>
